# Continuation-branch allocation probe through the previously registered workflow.
# The preserved recipe at 6374b323 is unchanged. Never label its output a new port.
name: Oriole registered workflow allocation probe
on:
  push:
    branches: [work/oriole-lineage22-susfs23-20261014]
    paths: ['.github/workflows/pixel6-a15-qpr2-kernel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Verify allocation without source, secrets, artifacts or downloads
        run: |
          printf 'ORIOLE_REGISTERED_RUNNER_ALLOCATED=YES\n'
          uname -sm
